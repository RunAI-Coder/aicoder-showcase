<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" role="img" aria-label="Ladder of evidence: from narration to re-runnable commands, checkability rises">
  <rect width="660" height="400" fill="#08090A"/>
  <text x="330" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#E8EAF0">What a report can hand you</text>
  <text x="330" y="56" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9AA1AD">higher rungs cost the subagent little and save the reviewer a lot</text>

  <!-- rungs, bottom to top -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="90" y="308" width="480" height="44" rx="8" fill="none" stroke="#6E7681" stroke-width="1.6"/>
    <text x="112" y="330" font-size="13" font-weight="600" fill="#9AA1AD">adjectives</text>
    <text x="112" y="345" font-size="10.5" fill="#6E7681">"thorough", "all good", "done"</text>

    <rect x="112" y="252" width="436" height="44" rx="8" fill="none" stroke="#B5822A" stroke-width="1.8"/>
    <text x="134" y="274" font-size="13" font-weight="600" fill="#E8EAF0">named things</text>
    <text x="134" y="289" font-size="10.5" fill="#9AA1AD">file paths, symbols, line numbers</text>

    <rect x="134" y="196" width="392" height="44" rx="8" fill="none" stroke="#B5822A" stroke-width="1.8"/>
    <text x="156" y="218" font-size="13" font-weight="600" fill="#E8EAF0">verbatim quotes</text>
    <text x="156" y="233" font-size="10.5" fill="#9AA1AD">the exact sentence the claim rests on</text>

    <rect x="156" y="140" width="348" height="44" rx="8" fill="none" stroke="#45A87D" stroke-width="2"/>
    <text x="178" y="162" font-size="13" font-weight="600" fill="#E8EAF0">artifacts</text>
    <text x="178" y="177" font-size="10.5" fill="#9AA1AD">diffs, test output, screenshots</text>

    <rect x="178" y="84" width="304" height="44" rx="8" fill="none" stroke="#6B7FE3" stroke-width="2"/>
    <text x="200" y="106" font-size="13" font-weight="600" fill="#E8EAF0">replayable steps</text>
    <text x="200" y="121" font-size="10.5" fill="#9AA1AD">the command you can re-run yourself</text>
  </g>

  <!-- axis arrow -->
  <line x1="600" y1="340" x2="600" y2="96" stroke="#9AA1AD" stroke-width="1.6"/>
  <path d="M600,88 l-5,10 h10 z" fill="#9AA1AD"/>
  <text x="613" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9AA1AD" transform="rotate(90 613 220)" text-anchor="middle">checkability</text>

  <text x="330" y="384" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6E7681">Illustrative ordering, taken from our dispatch-brief checklist; unmeasured.</text>
</svg>
