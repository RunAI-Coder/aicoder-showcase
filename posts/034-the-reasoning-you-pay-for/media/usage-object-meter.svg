<svg xmlns="http://www.w3.org/2000/svg" width="660" height="416" viewBox="0 0 660 416" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What the usage object shows, and what it does not</title>
  <rect width="660" height="416" fill="#08090A"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#E4E5E9">What the usage object shows, and what it does not</text>
  <text x="20" y="44" font-size="9.5" fill="#B9BEC6">One response, as printed in OpenAI's reasoning guide. Anthropic's equivalent field is usage.output_tokens_details.thinking_tokens.</text>

  <!-- response card -->
  <rect x="20" y="62" width="310" height="304" rx="4" fill="#10161B" stroke="#1E2630"/>
  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" fill="#B9BEC6">
    <text x="34" y="86">"usage": {</text>
    <text x="47" y="108">"input_tokens": 75,</text>
    <text x="47" y="130">"input_tokens_details": {</text>
    <text x="60" y="152">"cached_tokens": 0</text>
    <text x="47" y="174">},</text>
    <text x="47" y="196">"output_tokens": <tspan fill="#B5822A" font-weight="700">1186</tspan>,</text>
    <text x="47" y="218">"output_tokens_details": {</text>
    <text x="60" y="240">"reasoning_tokens": <tspan fill="#6B7FE3" font-weight="700">1024</tspan></text>
    <text x="47" y="262">},</text>
    <text x="47" y="284">"total_tokens": <tspan fill="#E4E5E9" font-weight="700">1261</tspan></text>
    <text x="34" y="306">}</text>
    <text x="34" y="340" fill="#5A6069">"loops": <tspan font-style="italic">no such field</tspan></text>
  </g>
  <line x1="34" y1="345" x2="200" y2="345" stroke="#5A6069" stroke-dasharray="3 3"/>

  <!-- callout A: output_tokens -->
  <line x1="330" y1="192" x2="346" y2="192" stroke="#B5822A"/>
  <text x="350" y="190" font-size="9.5" fill="#B5822A" font-weight="700">Billed at the output rate.</text>
  <text x="350" y="204" font-size="9.5" fill="#B9BEC6">Answer text and reasoning, one number.</text>

  <!-- callout B: reasoning_tokens -->
  <line x1="330" y1="236" x2="346" y2="236" stroke="#6B7FE3"/>
  <text x="350" y="232" font-size="9.5" fill="#6B7FE3" font-weight="700">1,024 of the 1,186 output tokens (86%) are reasoning.</text>
  <text x="350" y="246" font-size="9.5" fill="#B9BEC6">The text stays with the vendor, shown to you at most as a summary.</text>
  <text x="350" y="260" font-size="9.5" fill="#B9BEC6">The count is yours to log. This is the number to keep.</text>

  <!-- callout C: total_tokens -->
  <line x1="330" y1="280" x2="346" y2="280" stroke="#8A8F98"/>
  <text x="350" y="278" font-size="9.5" fill="#E4E5E9" font-weight="700">All of it occupied the context window.</text>
  <text x="350" y="292" font-size="9.5" fill="#B9BEC6">On keep-all models earlier reasoning stays in context;</text>
  <text x="350" y="306" font-size="9.5" fill="#B9BEC6">Anthropic bills it as input.</text>

  <!-- callout D: loops -->
  <line x1="330" y1="332" x2="346" y2="332" stroke="#5A6069" stroke-dasharray="3 3"/>
  <text x="350" y="330" font-size="9.5" fill="#8A8F98" font-weight="700">Recurrent depth has no field.</text>
  <text x="350" y="344" font-size="9.5" fill="#8A8F98">Extra passes through the same layers add compute per token</text>
  <text x="350" y="358" font-size="9.5" fill="#8A8F98">and nothing to count. No API we know of exposes a loop count.</text>

  <text x="20" y="390" font-size="8.5" fill="#5A6069">Values as printed in the example response in OpenAI's reasoning guide (Sept 2026); 86% is 1,024 ÷ 1,186. "loops" is a placeholder for a field that does not exist.</text>
  <text x="20" y="404" font-size="8.5" fill="#5A6069">Not our measurement. Layout ours.</text>
</svg>
