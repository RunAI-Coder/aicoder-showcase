<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360" role="img" aria-label="Same failure, two loops: a vague error message sends the agent into a many-turn guessing orbit, while a precise error with values and identifiers ends in two turns">
  <rect width="660" height="360" fill="#08090A"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="24" y="30" font-size="17" font-weight="600" fill="#E8E9EB">Same failure, two loops</text>
    <text x="24" y="49" font-size="11" fill="#9BA0A8">what the agent does next is steered by what the failure printed</text>

    <!-- left: vague -->
    <g font-family="ui-monospace, Consolas, monospace">
      <rect x="24" y="66" width="296" height="30" rx="4" fill="#1A140A" stroke="#B5822A" stroke-width="1.4"/>
      <text x="36" y="85" font-size="11" fill="#B5822A">Error: operation failed</text>
    </g>
    <g>
      <rect x="24" y="104" width="296" height="24" rx="3" fill="#10131A" stroke="#2A2F3A"/>
      <text x="36" y="120" font-size="10.5" fill="#9BA0A8">turn 1 · grep "operation" — 214 hits</text>
      <rect x="24" y="132" width="296" height="24" rx="3" fill="#10131A" stroke="#2A2F3A"/>
      <text x="36" y="148" font-size="10.5" fill="#9BA0A8">turn 2 · re-run, same line</text>
      <rect x="24" y="160" width="296" height="24" rx="3" fill="#10131A" stroke="#2A2F3A"/>
      <text x="36" y="176" font-size="10.5" fill="#9BA0A8">turn 3 · add print statements</text>
      <rect x="24" y="188" width="296" height="24" rx="3" fill="#10131A" stroke="#2A2F3A"/>
      <text x="36" y="204" font-size="10.5" fill="#9BA0A8">turn 4 · re-run with prints</text>
      <rect x="24" y="216" width="296" height="24" rx="3" fill="#10131A" stroke="#2A2F3A"/>
      <text x="36" y="232" font-size="10.5" fill="#9BA0A8">turn 5 · new hypothesis, edit</text>
      <rect x="24" y="244" width="296" height="24" rx="3" fill="#10131A" stroke="#2A2F3A"/>
      <text x="36" y="260" font-size="10.5" fill="#9BA0A8">turn 6 · re-run … green, finally</text>
      <text x="36" y="292" font-size="10.5" fill="#B5822A">each extra lap re-sends the whole context</text>
    </g>

    <!-- right: precise -->
    <g font-family="ui-monospace, Consolas, monospace">
      <rect x="340" y="66" width="296" height="44" rx="4" fill="#10131A" stroke="#6B7FE3" stroke-width="1.4"/>
      <text x="352" y="84" font-size="10.5" fill="#E8E9EB">AssertionError: expected 3, got 2</text>
      <text x="352" y="100" font-size="10.5" fill="#6B7FE3">(missing: 'SKU-4431')</text>
    </g>
    <g>
      <rect x="340" y="118" width="296" height="24" rx="3" fill="#10131A" stroke="#2A2F3A"/>
      <text x="352" y="134" font-size="10.5" fill="#9BA0A8">turn 1 · grep 'SKU-4431' — lands</text>
      <rect x="340" y="146" width="296" height="24" rx="3" fill="#0E1712" stroke="#45A87D" stroke-width="1.4"/>
      <text x="352" y="162" font-size="10.5" fill="#45A87D">turn 2 · fix, re-run, green</text>
      <text x="352" y="194" font-size="10.5" fill="#45A87D">values + identifiers = the search lands</text>
    </g>

    <!-- verdict line -->
    <line x1="24" y1="316" x2="636" y2="316" stroke="#1C1F26"/>
    <text x="24" y="336" font-size="10.5" fill="#9BA0A8">same bug, same model: the error text set the turn count</text>

    <text x="24" y="352" font-size="9" fill="#5A5F68">concept diagram — turn counts illustrative, not measured</text>
  </g>
</svg>
