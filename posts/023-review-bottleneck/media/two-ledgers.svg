<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" role="img" aria-label="Same dataset, two ledgers: output-side gains versus absorption-side deterioration in high-AI-adoption teams">
  <rect width="660" height="400" fill="#F6F8FA"/>
  <text x="330" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328">Same dataset, two ledgers</text>
  <text x="330" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#57606A">high-AI-adoption quarters vs. each team's lowest, two years of telemetry (22,000 developers)</text>

  <!-- left card: output -->
  <rect x="48" y="76" width="272" height="248" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
  <text x="184" y="104" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0072B2">the output ledger</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="72" y="142" font-size="21" font-weight="600" fill="#0072B2">+34%</text>
    <text x="160" y="142" font-size="12" fill="#1F2328">tasks completed per dev</text>
    <text x="72" y="186" font-size="21" font-weight="600" fill="#0072B2">+66%</text>
    <text x="160" y="186" font-size="12" fill="#1F2328">epics per dev</text>
    <text x="72" y="230" font-size="21" font-weight="600" fill="#0072B2">+210%</text>
    <text x="160" y="230" font-size="12" fill="#1F2328">code-touching tasks</text>
    <text x="72" y="274" font-size="21" font-weight="600" fill="#0072B2">60%</text>
    <text x="160" y="274" font-size="12" fill="#1F2328">AI-written code accepted (was 20%)†</text>
  </g>
  <text x="184" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#57606A">everything the demos promised</text>

  <!-- right card: absorption -->
  <rect x="340" y="76" width="272" height="248" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
  <text x="476" y="104" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#D55E00">the absorption ledger</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="364" y="142" font-size="21" font-weight="600" fill="#D55E00">×5</text>
    <text x="452" y="142" font-size="12" fill="#1F2328">median review time</text>
    <text x="364" y="186" font-size="21" font-weight="600" fill="#D55E00">+31.3%</text>
    <text x="452" y="186" font-size="12" fill="#1F2328">PRs merged with no review</text>
    <text x="364" y="230" font-size="21" font-weight="600" fill="#D55E00">×3+</text>
    <text x="452" y="230" font-size="12" fill="#1F2328">incidents per PR</text>
    <text x="364" y="274" font-size="21" font-weight="600" fill="#D55E00">+480%</text>
    <text x="452" y="274" font-size="12" fill="#1F2328">commit→prod lead time*</text>
  </g>
  <text x="476" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#57606A">where it has to be absorbed</text>

  <text x="48" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#57606A">*among organizations that instrumented the metric&#160;&#160;&#160;†vs. Faros's prior dataset, a different comparison basis</text>
  <text x="48" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8B949E">Source: Faros AI "Acceleration Whiplash" report (March 2026), figures as covered by ADTmag — not our measurement.</text>
</svg>
