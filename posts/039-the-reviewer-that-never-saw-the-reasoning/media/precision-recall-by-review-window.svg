<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Same model, four review windows: what it caught among 150 planted errors</title>
<rect width="660" height="400" fill="#FFFFFF"/>
