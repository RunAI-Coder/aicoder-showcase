<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" role="img" aria-label="The invalidation cascade: cache prefixes build in the order tools, system, messages; a change at any level invalidates that level and everything below it">
  <rect width="660" height="270" fill="#08090A"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="24" y="30" font-size="17" font-weight="600" fill="#E8E9EB">The invalidation cascade</text>
    <text x="24" y="49" font-size="11" fill="#9BA0A8">why stable content lives at the top and harnesses append instead of rewriting</text>

    <!-- levels -->
    <g>
      <rect x="60" y="72" width="330" height="38" rx="4" fill="#10131A" stroke="#6B7FE3" stroke-width="1.4"/>
      <text x="76" y="96" font-size="12.5" fill="#E8E9EB">tools</text>
      <text x="376" y="96" font-size="10" fill="#5A5F68" text-anchor="end">cached level 1</text>

      <rect x="60" y="118" width="330" height="38" rx="4" fill="#10131A" stroke="#6B7FE3" stroke-width="1.4"/>
      <text x="76" y="142" font-size="12.5" fill="#E8E9EB">system</text>
      <text x="376" y="142" font-size="10" fill="#5A5F68" text-anchor="end">cached level 2</text>

      <rect x="60" y="164" width="330" height="38" rx="4" fill="#10131A" stroke="#6B7FE3" stroke-width="1.4"/>
      <text x="76" y="188" font-size="12.5" fill="#E8E9EB">messages</text>
      <text x="376" y="188" font-size="10" fill="#5A5F68" text-anchor="end">cached level 3</text>
    </g>

    <!-- edit marker on tools -->
    <g>
      <circle cx="416" cy="91" r="9" fill="#B5822A"/>
      <text x="416" y="95" font-size="11" font-weight="700" fill="#08090A" text-anchor="middle">!</text>
      <text x="434" y="87" font-size="11" font-weight="600" fill="#B5822A">one tool definition changes</text>
      <text x="434" y="102" font-size="10" fill="#9BA0A8">(a harness update is enough)</text>
    </g>

    <!-- cascade shading -->
    <path d="M416,102 C416,130 416,150 416,178" stroke="#B5822A" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
    <path d="M416,184 l-5,-8 h10 z" fill="#B5822A"/>
    <text x="434" y="136" font-size="10.5" fill="#B5822A">this level and every level below</text>
    <text x="434" y="151" font-size="10.5" fill="#B5822A">reprocess at full price next turn</text>
    <text x="434" y="166" font-size="10" fill="#9BA0A8">(re-caching adds a write premium)</text>

    <text x="60" y="228" font-size="10.5" fill="#9BA0A8">"Changes at each level invalidate that level and all subsequent levels."</text>

    <text x="24" y="254" font-size="9" fill="#5A5F68">concept diagram — hierarchy and quote per Anthropic prompt-caching docs (as of 2026-08); not our measurement</text>
  </g>
</svg>
