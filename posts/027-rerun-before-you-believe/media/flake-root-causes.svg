<svg xmlns="http://www.w3.org/2000/svg" width="660" height="416" viewBox="0 0 660 416" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="660" height="416" fill="#FFFFFF"/>

  <text x="24" y="34" font-size="16" font-weight="700" fill="#1F2328">Where the red lights come from</text>
  <text x="24" y="54" font-size="11.5" fill="#57606A">Root causes of 161 flaky-test fixes across 51 Apache projects, from a 2014 study</text>

  <!-- legend -->
  <rect x="24" y="66" width="10" height="10" rx="2" fill="#0072B2"/>
  <text x="39" y="75" font-size="10.5" fill="#57606A">top three causes (77% together)</text>
  <rect x="214" y="66" width="10" height="10" rx="2" fill="#A8B3BD"/>
  <text x="229" y="75" font-size="10.5" fill="#57606A">other causes</text>

  <!-- rows: label right-aligned at 168, bar from 178, 3.9 px per commit, bar h 15 -->
  <g font-size="11.5" fill="#1F2328">
    <text x="168" y="99" text-anchor="end">Async wait</text>
    <rect x="178" y="87" width="288.6" height="15" rx="3" fill="#0072B2"/>
    <text x="473" y="99" font-size="11" fill="#57606A">74 · 45%</text>

    <text x="168" y="124" text-anchor="end">Concurrency</text>
    <rect x="178" y="112" width="124.8" height="15" rx="3" fill="#0072B2"/>
    <text x="309" y="124" font-size="11" fill="#57606A">32 · 20%</text>

    <text x="168" y="149" text-anchor="end">Test order dependency</text>
    <rect x="178" y="137" width="74.1" height="15" rx="3" fill="#0072B2"/>
    <text x="258" y="149" font-size="11" fill="#57606A">19 · 12%</text>

    <text x="168" y="174" text-anchor="end">Resource leak</text>
    <rect x="178" y="162" width="42.9" height="15" rx="3" fill="#A8B3BD"/>
    <text x="227" y="174" font-size="11" fill="#57606A">11 · 7%</text>

    <text x="168" y="199" text-anchor="end">Network</text>
    <rect x="178" y="187" width="39" height="15" rx="3" fill="#A8B3BD"/>
    <text x="223" y="199" font-size="11" fill="#57606A">10 · 6%</text>

    <text x="168" y="224" text-anchor="end">Time</text>
    <rect x="178" y="212" width="19.5" height="15" rx="3" fill="#A8B3BD"/>
    <text x="204" y="224" font-size="11" fill="#57606A">5 · 3%</text>

    <text x="168" y="249" text-anchor="end">I/O</text>
    <rect x="178" y="237" width="15.6" height="15" rx="3" fill="#A8B3BD"/>
    <text x="200" y="249" font-size="11" fill="#57606A">4 · 2%</text>

    <text x="168" y="274" text-anchor="end">Randomness</text>
    <rect x="178" y="262" width="15.6" height="15" rx="3" fill="#A8B3BD"/>
    <text x="200" y="274" font-size="11" fill="#57606A">4 · 2%</text>

    <text x="168" y="299" text-anchor="end">Floating point</text>
    <rect x="178" y="287" width="11.7" height="15" rx="3" fill="#A8B3BD"/>
    <text x="196" y="299" font-size="11" fill="#57606A">3 · 2%</text>

    <text x="168" y="324" text-anchor="end">Unordered collections</text>
    <rect x="178" y="312" width="3.9" height="15" rx="3" fill="#A8B3BD"/>
    <text x="188" y="324" font-size="11" fill="#57606A">1 · 1%</text>
  </g>

  <!-- callout -->
  <rect x="330" y="172" width="306" height="134" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/>
  <rect x="330" y="172" width="4" height="134" rx="2" fill="#D55E00"/>
  <text x="348" y="197" font-size="12.5" font-weight="700" fill="#1F2328">24% of the fixes also changed</text>
  <text x="348" y="215" font-size="12.5" font-weight="700" fill="#1F2328">the code under test. 94% of those</text>
  <text x="348" y="233" font-size="12.5" font-weight="700" fill="#1F2328">fixed a real bug there.</text>
  <text x="348" y="259" font-size="11" fill="#57606A">The paper's stated implication: flaky tests "should</text>
  <text x="348" y="275" font-size="11" fill="#57606A">not simply be removed or disabled because they</text>
  <text x="348" y="291" font-size="11" fill="#57606A">can help uncover bugs in the CUT."</text>

  <!-- footnote -->
  <text x="24" y="362" font-size="9.5" fill="#8B949E">Data: Luo, Hariri, Eloussi and Marinov, "An Empirical Analysis of Flaky Tests", FSE 2014. Not our measurement.</text>
  <text x="24" y="377" font-size="9.5" fill="#8B949E">Counts and percentages as printed in the paper (Table 2; 161 classified commits, 40 unclassifiable ones excluded).</text>
  <text x="24" y="392" font-size="9.5" fill="#8B949E">Mostly Java, Apache SVN history, pre-2014. The paper's ten category counts add to 163 against its stated 161; reproduced unreconciled.</text>
</svg>
