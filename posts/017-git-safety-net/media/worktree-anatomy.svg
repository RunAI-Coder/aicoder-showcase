<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-label="Three agents, one object store: linked git worktrees give each agent its own checkout, branch, HEAD and index while sharing the repository's objects and refs">
  <rect width="660" height="330" fill="#FFFFFF"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="24" y="32" font-size="17" font-weight="600" fill="#1F2328">Three agents, one object store</text>
    <text x="24" y="51" font-size="11" fill="#57606A">linked worktrees: isolation where edits happen, sharing where history lives</text>

    <!-- worktrees -->
    <g>
      <rect x="34" y="76" width="180" height="96" rx="8" fill="#F6F8FA" stroke="#0072B2" stroke-width="1.5"/>
      <text x="50" y="100" font-size="12" font-weight="600" fill="#1F2328">main worktree</text>
      <text x="50" y="119" font-size="10.5" fill="#57606A">you, on `main`</text>
      <text x="50" y="140" font-size="10" fill="#8B949E">own HEAD · own index</text>
      <text x="50" y="158" font-size="10" fill="#0072B2">reviews the diffs</text>

      <rect x="240" y="76" width="180" height="96" rx="8" fill="#F6F8FA" stroke="#D55E00" stroke-width="1.5"/>
      <text x="256" y="100" font-size="12" font-weight="600" fill="#1F2328">worktree A</text>
      <text x="256" y="119" font-size="10.5" fill="#57606A">agent 1, on `task-a`</text>
      <text x="256" y="140" font-size="10" fill="#8B949E">own HEAD · own index</text>
      <text x="256" y="158" font-size="10" fill="#D55E00">edits can't collide with B</text>

      <rect x="446" y="76" width="180" height="96" rx="8" fill="#F6F8FA" stroke="#009E73" stroke-width="1.5"/>
      <text x="462" y="100" font-size="12" font-weight="600" fill="#1F2328">worktree B</text>
      <text x="462" y="119" font-size="10.5" fill="#57606A">agent 2, on `task-b`</text>
      <text x="462" y="140" font-size="10" fill="#8B949E">own HEAD · own index</text>
      <text x="462" y="158" font-size="10" fill="#009E73">edits can't collide with A</text>
    </g>

    <!-- connectors -->
    <line x1="124" y1="172" x2="124" y2="216" stroke="#8B949E" stroke-width="1.2"/>
    <line x1="330" y1="172" x2="330" y2="216" stroke="#8B949E" stroke-width="1.2"/>
    <line x1="536" y1="172" x2="536" y2="216" stroke="#8B949E" stroke-width="1.2"/>

    <!-- shared store -->
    <rect x="34" y="216" width="592" height="64" rx="8" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"/>
    <text x="330" y="242" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="middle">one shared repository</text>
    <text x="330" y="262" font-size="10.5" fill="#57606A" text-anchor="middle">objects · branches · tags — "sharing everything except per-worktree files such as HEAD, index, etc."</text>

    <text x="24" y="312" font-size="9" fill="#8B949E">concept diagram — per git-worktree docs (as of 2026-08); one branch can be checked out in only one worktree at a time (by default)</text>
  </g>
</svg>
