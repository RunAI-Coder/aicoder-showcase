<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380">
  <rect width="660" height="380" fill="#08090A"/>
  <text x="30" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#E4E5E9">Place information by its odds of surviving</text>
  <text x="30" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#B9BEC6">Compaction rewrites one layer; the other two hold</text>

  <!-- layer 1: rules files -->
  <rect x="30" y="80" width="460" height="70" rx="6" fill="#10161B" stroke="#45A87D" stroke-width="1.5"/>
  <text x="46" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#45A87D">Rules files (CLAUDE.md and kin)</text>
  <text x="46" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#B9BEC6">lives outside the chat history; back every turn</text>
  <text x="46" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8A8F98">forbidden moves, conventions, what counts as done</text>
  <text x="510" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#45A87D">comes back on</text>
  <text x="510" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#45A87D">its own, every turn</text>

  <!-- layer 2: filesystem -->
  <rect x="30" y="164" width="460" height="70" rx="6" fill="#10161B" stroke="#6B7FE3" stroke-width="1.5"/>
  <text x="46" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6B7FE3">The filesystem (notes, specs, code)</text>
  <text x="46" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#B9BEC6">on disk, re-readable any time</text>
  <text x="46" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8A8F98">decisions with their conditions, findings worth a file</text>
  <text x="510" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6B7FE3">safe on disk;</text>
  <text x="510" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6B7FE3">re-read to recall</text>

  <!-- layer 3: conversation -->
  <rect x="30" y="248" width="460" height="70" rx="6" fill="#10161B" stroke="#B5822A" stroke-width="1.5"/>
  <text x="46" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B5822A">The conversation itself</text>
  <text x="46" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#B9BEC6">summarized when the limit nears; a model picks what stays</text>
  <text x="46" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8A8F98">first to go: the why-nots, the conditions, the doubts</text>
  <text x="510" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#B5822A">this layer gets</text>
  <text x="510" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#B5822A">rewritten</text>

  <!-- footnote -->
  <text x="30" y="349" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5A6069">Mechanism per vendor docs (Claude Code best practices, Aug 2026) plus our own transcript reading;</text>
  <text x="30" y="363" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5A6069">the survival ranking is our heuristic, no measurements behind it.</text>
</svg>
