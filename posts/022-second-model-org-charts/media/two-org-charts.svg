<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" role="img" aria-label="Two org charts: advisor shape where a cheap executor escalates to a frontier advisor, and orchestrator shape where a frontier chair delegates to cheap workers">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5822A"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#08090A"/>
  <text x="330" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#E8EAF0">The two org charts</text>

  <!-- left: advisor -->
  <text x="165" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E8EAF0">advisor</text>
  <text x="165" y="83" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9AA1AD">low-cost model runs the loop, escalates</text>

  <rect x="95" y="100" width="140" height="52" rx="9" fill="none" stroke="#6B7FE3" stroke-width="2"/>
  <text x="165" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#E8EAF0">frontier advisor</text>
  <text x="165" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#9AA1AD">400–700 tokens of advice</text>

  <rect x="95" y="238" width="140" height="52" rx="9" fill="none" stroke="#45A87D" stroke-width="2"/>
  <text x="165" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#E8EAF0">low-cost executor</text>
  <text x="165" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#9AA1AD">every turn, every tool call</text>

  <line x1="145" y1="238" x2="145" y2="152" stroke="#B5822A" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="138" y="200" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#B5822A">"I'm stuck"</text>
  <line x1="185" y1="152" x2="185" y2="238" stroke="#6E7681" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="192" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#9AA1AD">a plan</text>

  <text x="165" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9AA1AD">frontier cost scales with</text>
  <text x="165" y="338" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#E8EAF0">how often the executor gets stuck</text>

  <!-- divider -->
  <line x1="330" y1="60" x2="330" y2="350" stroke="#2A2E33" stroke-width="1"/>

  <!-- right: orchestrator -->
  <text x="495" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E8EAF0">orchestrator</text>
  <text x="495" y="83" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9AA1AD">frontier model holds the loop, delegates</text>

  <rect x="425" y="100" width="140" height="52" rx="9" fill="none" stroke="#6B7FE3" stroke-width="2"/>
  <text x="495" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#E8EAF0">frontier chair</text>
  <text x="495" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#9AA1AD">plans, dispatches, merges</text>

  <rect x="370" y="238" width="76" height="52" rx="9" fill="none" stroke="#45A87D" stroke-width="2"/>
  <text x="408" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#E8EAF0">worker</text>
  <rect x="457" y="238" width="76" height="52" rx="9" fill="none" stroke="#45A87D" stroke-width="2"/>
  <text x="495" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#E8EAF0">worker</text>
  <rect x="544" y="238" width="76" height="52" rx="9" fill="none" stroke="#45A87D" stroke-width="2"/>
  <text x="582" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#E8EAF0">worker</text>

  <line x1="460" y1="152" x2="410" y2="238" stroke="#B5822A" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="495" y1="152" x2="495" y2="238" stroke="#B5822A" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="530" y1="152" x2="580" y2="238" stroke="#B5822A" stroke-width="1.6" marker-end="url(#a2)"/>

  <text x="495" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9AA1AD">frontier cost scales with</text>
  <text x="495" y="338" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#E8EAF0">how hard the pieces are to coordinate</text>

  <!-- legend + footnote -->
  <circle cx="230" cy="374" r="5" fill="#6B7FE3"/>
  <text x="242" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9AA1AD">frontier rates</text>
  <circle cx="340" cy="374" r="5" fill="#45A87D"/>
  <text x="352" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9AA1AD">worker rates</text>
  <text x="330" y="394" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#6E7681">Shapes and scaling rules per Anthropic's cost-optimization guide; illustrative, not our measurement.</text>
</svg>
