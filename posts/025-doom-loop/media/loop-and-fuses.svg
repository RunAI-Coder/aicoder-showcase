<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <rect width="660" height="400" fill="#FFFFFF"/>
  <text x="30" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">The doom loop, and where the fuses go</text>
  <text x="30" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#57606A">Each lap adds transcript that makes the next lap likelier</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606A"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8B949E"/>
    </marker>
  </defs>

  <!-- loop nodes -->
  <rect x="180" y="92" width="120" height="36" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="240" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#1F2328" text-anchor="middle">attempt fix X</text>

  <rect x="310" y="197" width="100" height="36" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="360" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#1F2328" text-anchor="middle">error</text>

  <rect x="180" y="302" width="120" height="36" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="240" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#1F2328" text-anchor="middle">apologize, sincerely</text>

  <rect x="55" y="197" width="130" height="36" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="120" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#1F2328" text-anchor="middle">fix X again,</text>
  <text x="120" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#1F2328" text-anchor="middle">new variable names</text>

  <!-- loop arrows clockwise -->
  <line x1="290" y1="128" x2="345" y2="192" stroke="#57606A" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="345" y1="238" x2="290" y2="300" stroke="#57606A" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="190" y1="300" x2="135" y2="238" stroke="#57606A" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="135" y1="192" x2="190" y2="130" stroke="#57606A" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- center note -->
  <text x="240" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#8B949E" text-anchor="middle">the transcript gains</text>
  <text x="240" y="223" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#8B949E" text-anchor="middle">one more lap</text>

  <!-- exits to breakers -->
  <line x1="412" y1="205" x2="465" y2="130" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrO)"/>
  <line x1="412" y1="215" x2="465" y2="215" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrO)"/>
  <line x1="412" y1="225" x2="465" y2="300" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrO)"/>

  <!-- breaker cards -->
  <rect x="470" y="100" width="170" height="52" rx="6" fill="#F6F8FA" stroke="#D55E00" stroke-width="1.5"/>
  <text x="484" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#D55E00">budget cap</text>
  <text x="484" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#57606A">turns, tokens or time: stop</text>

  <rect x="470" y="189" width="170" height="52" rx="6" fill="#F6F8FA" stroke="#0072B2" stroke-width="1.5"/>
  <text x="484" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0072B2">repeat detector</text>
  <text x="484" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#57606A">same diff twice: force a new hypothesis</text>

  <rect x="470" y="278" width="170" height="52" rx="6" fill="#F6F8FA" stroke="#009E73" stroke-width="1.5"/>
  <text x="484" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#009E73">fresh window</text>
  <text x="484" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#57606A">clear; constraints carry over</text>

  <!-- footnote -->
  <text x="30" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#8B949E">Mechanism sketch, our heuristic. Loop evidence: vendor docs + arXiv 2511.00197 (their measurements, not ours).</text>
</svg>
