<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="660" height="400" fill="#FFFFFF"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#1F2328">Longer drafts stop paying, and one configuration never did</text>
  <text x="24" y="52" font-size="11.5" fill="#57606A">Output throughput relative to plain decoding, by draft tokens proposed per round; three configurations, one study.</text>

  <!-- plot frame: x 80..600 (N 0..16, 32.5 px/unit), y 80..330 (0..3.0, 83.33 px per 1.0); y(r) = 330 - r*83.33 -->
  <rect x="80" y="80" width="520" height="250" fill="#F6F8FA" stroke="#D0D7DE"/>
  <line x1="80" y1="330" x2="600" y2="330" stroke="#D0D7DE"/>
  <line x1="80" y1="163" x2="600" y2="163" stroke="#E6EAEE"/>
  <line x1="80" y1="80" x2="600" y2="80" stroke="#E6EAEE"/>
  <!-- baseline 1.0x dashed -->
  <line x1="80" y1="247" x2="600" y2="247" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="86" y="243" font-size="10" fill="#57606A">1.0x = plain decoding</text>
  <text x="72" y="334" font-size="10" fill="#8B949E" text-anchor="end">0x</text>
  <text x="72" y="251" font-size="10" fill="#8B949E" text-anchor="end">1x</text>
  <text x="72" y="167" font-size="10" fill="#8B949E" text-anchor="end">2x</text>
  <text x="72" y="84" font-size="10" fill="#8B949E" text-anchor="end">3x</text>

  <!-- x ticks: N=1 ->112.5, 3->177.5, 5->242.5, 7->307.5, 11->437.5, 15->567.5 -->
  <text x="112" y="348" font-size="10" fill="#57606A" text-anchor="middle">1</text>
  <text x="177" y="348" font-size="10" fill="#57606A" text-anchor="middle">3</text>
  <text x="242" y="348" font-size="10" fill="#57606A" text-anchor="middle">5</text>
  <text x="307" y="348" font-size="10" fill="#57606A" text-anchor="middle">7</text>
  <text x="437" y="348" font-size="10" fill="#57606A" text-anchor="middle">11</text>
  <text x="567" y="348" font-size="10" fill="#57606A" text-anchor="middle">15</text>
  <text x="340" y="364" font-size="10.5" fill="#57606A" text-anchor="middle">draft tokens proposed per round (N)</text>

  <!-- A: gemma-4-26B-A4B-it / DFlash / MATH500: 3->2.49 (y 122.5), 7->2.87 (90.8), 11->2.70 (105), 15->2.40 (130) -->
  <polyline points="177.5,122.5 307.5,90.8 437.5,105 567.5,130" fill="none" stroke="#0072B2" stroke-width="2"/>
  <circle cx="177.5" cy="122.5" r="4" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="307.5" cy="90.8" r="4" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="437.5" cy="105" r="4" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="567.5" cy="130" r="4" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"/>
  <text x="307.5" y="82" font-size="10" fill="#1F2328" text-anchor="middle">2.87x</text>
  <text x="440" y="98" font-size="10.5" font-weight="700" fill="#1F2328">gemma-4-26B-A4B-it, DFlash, MATH500</text>
  <text x="578" y="134" font-size="10" fill="#1F2328">2.40x</text>

  <!-- B: Qwen3.5-122B-A10B / DFlash / GSM8K: 3->1.41 (212.5), 7->1.58 (198.3), 11->1.38 (215), 15->1.01 (245.8) -->
  <polyline points="177.5,212.5 307.5,198.3 437.5,215 567.5,245.8" fill="none" stroke="#009E73" stroke-width="2"/>
  <circle cx="177.5" cy="212.5" r="4" fill="#009E73" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="307.5" cy="198.3" r="4" fill="#009E73" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="437.5" cy="215" r="4" fill="#009E73" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="567.5" cy="245.8" r="4" fill="#009E73" stroke="#FFFFFF" stroke-width="2"/>
  <text x="307.5" y="190" font-size="10" fill="#1F2328" text-anchor="middle">1.58x</text>
  <text x="440" y="208" font-size="10.5" font-weight="700" fill="#1F2328">Qwen3.5-122B-A10B, DFlash, GSM8K</text>
  <text x="578" y="262" font-size="10" fill="#1F2328">1.01x</text>

  <!-- C: Qwen3-8B / EAGLE-3 / MATH500: 1->.44 (293.3), 2->.61 (279.2), 3->.72 (270), 4->.78 (265), 5->.83 (260.8), 6->.85 (259.2), 7->.88 (256.7) -->
  <polyline points="112.5,293.3 145,279.2 177.5,270 210,265 242.5,260.8 275,259.2 307.5,256.7" fill="none" stroke="#D55E00" stroke-width="2"/>
  <circle cx="112.5" cy="293.3" r="4" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="145" cy="279.2" r="3" fill="#D55E00" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="210" cy="265" r="3" fill="#D55E00" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="275" cy="259.2" r="3" fill="#D55E00" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="177.5" cy="270" r="4" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="242.5" cy="260.8" r="4" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="307.5" cy="256.7" r="4" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"/>
  <text x="112.5" y="310" font-size="10" fill="#1F2328" text-anchor="middle">0.44x</text>
  <text x="318" y="274" font-size="10.5" font-weight="700" fill="#1F2328">Qwen3-8B, EAGLE-3, MATH500: 0.88x at best</text>

  <text x="24" y="382" font-size="9" fill="#8B949E">Data: AMD and Embedded LLM, vLLM blog, Aug 2026: "Exploring Speculative Decoding in vLLM on AMD GPUs". MI300X, vLLM 0.23.1rc1.</text>
  <text x="24" y="395" font-size="9" fill="#8B949E">Ratio = output-token throughput vs the non-speculative baseline, same model; one line = one target, draft method, dataset. Not our measurement.</text>
</svg>
