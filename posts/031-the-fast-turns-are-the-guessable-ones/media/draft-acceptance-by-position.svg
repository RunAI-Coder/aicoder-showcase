<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="660" height="400" fill="#FFFFFF"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#1F2328">Acceptance falls with draft position, and sits lower on code</text>
  <text x="24" y="52" font-size="11.5" fill="#57606A">gemma-4-26B-A4B-it with the Gemma 4 MTP draft component, five tokens proposed per round; acceptance rate by position.</text>

  <!-- plot frame: x 90..560, y 90..330 ; y(v) = 330 - (v-40)*4 -->
  <rect x="90" y="90" width="470" height="240" fill="#F6F8FA" stroke="#D0D7DE"/>
  <!-- gridlines at 40,50,60,70,80,90,100 -->
  <line x1="90" y1="330" x2="560" y2="330" stroke="#D0D7DE"/>
  <line x1="90" y1="290" x2="560" y2="290" stroke="#E6EAEE"/>
  <line x1="90" y1="250" x2="560" y2="250" stroke="#E6EAEE"/>
  <line x1="90" y1="210" x2="560" y2="210" stroke="#E6EAEE"/>
  <line x1="90" y1="170" x2="560" y2="170" stroke="#E6EAEE"/>
  <line x1="90" y1="130" x2="560" y2="130" stroke="#E6EAEE"/>
  <line x1="90" y1="90" x2="560" y2="90" stroke="#E6EAEE"/>
  <text x="82" y="334" font-size="10" fill="#8B949E" text-anchor="end">40%</text>
  <text x="82" y="254" font-size="10" fill="#8B949E" text-anchor="end">60%</text>
  <text x="82" y="174" font-size="10" fill="#8B949E" text-anchor="end">80%</text>
  <text x="82" y="94" font-size="10" fill="#8B949E" text-anchor="end">100%</text>

  <!-- x positions: p1=130, p2=230, p3=330, p4=430, p5=530 -->
  <text x="130" y="350" font-size="10.5" fill="#57606A" text-anchor="middle">1st draft token</text>
  <text x="230" y="350" font-size="10.5" fill="#57606A" text-anchor="middle">2nd</text>
  <text x="330" y="350" font-size="10.5" fill="#57606A" text-anchor="middle">3rd</text>
  <text x="430" y="350" font-size="10.5" fill="#57606A" text-anchor="middle">4th</text>
  <text x="530" y="350" font-size="10.5" fill="#57606A" text-anchor="middle">5th</text>

  <!-- GSM8K: 94,87,80,73,66 -> y 114,142,170,198,226 -->
  <polyline points="130,114 230,142 330,170 430,198 530,226" fill="none" stroke="#0072B2" stroke-width="2"/>
  <circle cx="130" cy="114" r="4" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="230" cy="142" r="4" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="330" cy="170" r="4" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="430" cy="198" r="4" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="530" cy="226" r="4" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"/>
  <text x="130" y="104" font-size="10" fill="#0072B2" text-anchor="middle">94%</text>
  <text x="542" y="222" font-size="10.5" font-weight="700" fill="#1F2328">66%  GSM8K (math)</text>

  <!-- HumanEval: 92,84,76,69,62 -> y 122,154,186,214,242 -->
  <polyline points="130,122 230,154 330,186 430,214 530,242" fill="none" stroke="#009E73" stroke-width="2"/>
  <circle cx="130" cy="122" r="4" fill="#009E73" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="230" cy="154" r="4" fill="#009E73" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="330" cy="186" r="4" fill="#009E73" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="430" cy="214" r="4" fill="#009E73" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="530" cy="242" r="4" fill="#009E73" stroke="#FFFFFF" stroke-width="2"/>
  <text x="118" y="138" font-size="10" fill="#009E73" text-anchor="end">92%</text>
  <text x="542" y="248" font-size="10.5" font-weight="700" fill="#1F2328">62%  HumanEval (code)</text>

  <!-- MBPP: 89,77,66,57,49 -> y 134,182,226,262,294 -->
  <polyline points="130,134 230,182 330,226 430,262 530,294" fill="none" stroke="#D55E00" stroke-width="2"/>
  <circle cx="130" cy="134" r="4" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="230" cy="182" r="4" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="330" cy="226" r="4" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="430" cy="262" r="4" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="530" cy="294" r="4" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"/>
  <text x="118" y="152" font-size="10" fill="#D55E00" text-anchor="end">89%</text>
  <text x="542" y="298" font-size="10.5" font-weight="700" fill="#1F2328">49%  MBPP (code)</text>

  <text x="24" y="376" font-size="9" fill="#8B949E">Data: AMD and Embedded LLM, vLLM blog, Aug 2026: "Exploring Speculative Decoding in vLLM on AMD GPUs". MI300X, vLLM 0.23.1rc1.</text>
  <text x="24" y="390" font-size="9" fill="#8B949E">Speedup over plain decoding at N=5: 2.74x (GSM8K), 2.59x (HumanEval), 2.62x (MBPP). Not our measurement. Chart layout ours.</text>
</svg>
