  <polyline points="80.0,238.2 154.3,217.2 228.6,206.3 302.9,199.9 377.1,195.1 451.4,191.5 525.7,188.3 600.0,186.0" fill="none" stroke="#B1B7BE" stroke-width="1.5"/>
  <polyline points="80.0,240.7 154.3,224.0 228.6,215.4 302.9,210.5 377.1,207.5 451.4,205.8 525.7,205.0 600.0,205.0" fill="none" stroke="#B1B7BE" stroke-width="1.5"/>
  <polyline points="80.0,255.0 154.3,240.9 228.6,232.2 302.9,225.3 377.1,219.6 451.4,214.5 525.7,209.8 600.0,205.0" fill="none" stroke="#B1B7BE" stroke-width="1.5"/>
