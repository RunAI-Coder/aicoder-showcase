  <polyline points="80.0,269.0 154.3,259.3 228.6,255.2 302.9,252.5 377.1,250.0 451.4,247.8 525.7,245.5 600.0,243.0" fill="none" stroke="#B1B7BE" stroke-width="1.5"/>
  <polyline points="80.0,226.3 154.3,209.0 228.6,197.6 302.9,188.7 377.1,182.0 451.4,176.5 525.7,171.8 600.0,167.0" fill="none" stroke="#0072B2" stroke-width="2.5"/>
  <polyline points="80.0,245.5 154.3,207.7 228.6,181.6 302.9,163.2 377.1,150.1 451.4,140.6 525.7,133.8 600.0,129.0" fill="none" stroke="#D55E00" stroke-width="2.5"/>
  <circle cx="80.0" cy="226.3" r="3" fill="#0072B2"/>
  <circle cx="154.3" cy="209.0" r="3" fill="#0072B2"/>
  <circle cx="228.6" cy="197.6" r="3" fill="#0072B2"/>
  <circle cx="302.9" cy="188.7" r="3" fill="#0072B2"/>
  <circle cx="377.1" cy="182.0" r="3" fill="#0072B2"/>
  <circle cx="451.4" cy="176.5" r="3" fill="#0072B2"/>
  <circle cx="525.7" cy="171.8" r="3" fill="#0072B2"/>
  <circle cx="600.0" cy="167.0" r="3" fill="#0072B2"/>
  <circle cx="80.0" cy="245.5" r="3" fill="#D55E00"/>
  <circle cx="154.3" cy="207.7" r="3" fill="#D55E00"/>
  <circle cx="228.6" cy="181.6" r="3" fill="#D55E00"/>
  <circle cx="302.9" cy="163.2" r="3" fill="#D55E00"/>
