<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Each model&#39;s eighty runs, read as pass@1 through pass@8</title>
  <rect x="0" y="0" width="660" height="400" fill="#FFFFFF"/>
  <text x="32" y="40" font-size="17" font-weight="600" fill="#1F2328">Each model&#39;s eighty runs, read as pass@1 through pass@8</text>
  <text x="32" y="62" font-size="12" fill="#57606A">Eight models, ten tasks, eight runs each; the share of tasks solved at least once in k tries</text>
  <rect x="32" y="80" width="596" height="250" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/>
  <line x1="80" y1="300.0" x2="600" y2="300.0" stroke="#D0D7DE" stroke-width="1"/>
  <text x="72" y="304.0" font-size="11" fill="#8B949E" text-anchor="end">0%</text>
  <line x1="80" y1="252.5" x2="600" y2="252.5" stroke="#D0D7DE" stroke-width="1"/>
  <text x="72" y="256.5" font-size="11" fill="#8B949E" text-anchor="end">25%</text>
  <line x1="80" y1="205.0" x2="600" y2="205.0" stroke="#D0D7DE" stroke-width="1"/>
  <text x="72" y="209.0" font-size="11" fill="#8B949E" text-anchor="end">50%</text>
  <line x1="80" y1="157.5" x2="600" y2="157.5" stroke="#D0D7DE" stroke-width="1"/>
  <text x="72" y="161.5" font-size="11" fill="#8B949E" text-anchor="end">75%</text>
  <line x1="80" y1="110.0" x2="600" y2="110.0" stroke="#D0D7DE" stroke-width="1"/>
  <text x="72" y="114.0" font-size="11" fill="#8B949E" text-anchor="end">100%</text>
  <text x="80.0" y="318" font-size="11" fill="#8B949E" text-anchor="middle">pass@1</text>
  <text x="154.3" y="318" font-size="11" fill="#8B949E" text-anchor="middle">pass@2</text>
  <text x="228.6" y="318" font-size="11" fill="#8B949E" text-anchor="middle">pass@3</text>
  <text x="302.9" y="318" font-size="11" fill="#8B949E" text-anchor="middle">pass@4</text>
  <text x="377.1" y="318" font-size="11" fill="#8B949E" text-anchor="middle">pass@5</text>
  <text x="451.4" y="318" font-size="11" fill="#8B949E" text-anchor="middle">pass@6</text>
  <text x="525.7" y="318" font-size="11" fill="#8B949E" text-anchor="middle">pass@7</text>
  <text x="600.0" y="318" font-size="11" fill="#8B949E" text-anchor="middle">pass@8</text>
