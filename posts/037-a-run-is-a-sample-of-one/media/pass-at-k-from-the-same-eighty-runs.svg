  <text x="88" y="216.3" font-size="11" font-weight="600" fill="#0072B2" paint-order="stroke" stroke="#F6F8FA" stroke-width="4" stroke-linejoin="round">top row: 38.8% at one run</text>
  <text x="592" y="159.0" font-size="11" font-weight="600" fill="#0072B2" text-anchor="end" paint-order="stroke" stroke="#F6F8FA" stroke-width="4" stroke-linejoin="round">70% by eight runs (7 of 10 tasks)</text>
  <text x="88" y="290.5" font-size="11" font-weight="600" fill="#D55E00" paint-order="stroke" stroke="#F6F8FA" stroke-width="4" stroke-linejoin="round">fifth row: 28.8% at one run</text>
  <text x="592" y="121.0" font-size="11" font-weight="600" fill="#D55E00" text-anchor="end" paint-order="stroke" stroke="#F6F8FA" stroke-width="4" stroke-linejoin="round">90% by eight runs (9 of 10 tasks)</text>
  <text x="592" y="257.0" font-size="10.5" fill="#8B949E" text-anchor="end">other six rows in gray</text>
  <text x="32" y="352" font-size="10.5" fill="#8B949E">Data: Real-SWE trial table (Specific Labs, Sept 2026), 10 sample tasks x 8 runs per model. pass@k is our arithmetic on their counts</text>
  <text x="32" y="367" font-size="10.5" fill="#8B949E">(unbiased estimator, averaged over tasks). Not our measurement. Layout ours. Models unnamed here; the source names them.</text>
  <text x="32" y="388" font-size="10.5" fill="#8B949E">pass@1 is the leaderboard figure. pass@8 is the share of tasks the model solved in at least one of its eight runs.</text>
</svg>
