<svg xmlns="http://www.w3.org/2000/svg" width="660" height="414" viewBox="0 0 660 414" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the sixteen failures surfaced</title>
  <rect width="660" height="414" fill="#FFFFFF"/>
  <!-- title block -->
  <text x="32" y="32" font-size="15" font-weight="700" fill="#1F2328">How the sixteen failures surfaced</text>
  <text x="32" y="51" font-size="11" fill="#57606A">Six unattended runs: three printable parts, each modeled in OpenSCAD and in CadQuery. One square is one failure.</text>
  <!-- legend -->
  <rect x="32" y="66" width="12" height="12" rx="2" fill="#0072B2"/>
  <text x="50" y="76" font-size="10.5" fill="#1F2328">Raised by the tool as an error (7)</text>
  <rect x="250" y="66" width="12" height="12" rx="2" fill="#D55E00"/>
  <text x="268" y="76" font-size="10.5" fill="#1F2328">Wrong geometry the tool did not report (9)</text>
  <!-- baseline -->
  <line x1="32" y1="250" x2="628" y2="250" stroke="#D0D7DE" stroke-width="1"/>
  <!-- column 1: bracket, OpenSCAD  cx=90  1 raised -->
  <rect x="73" y="226" width="22" height="22" rx="3" fill="#0072B2"/>
  <text x="84" y="216" font-size="10.5" text-anchor="middle" fill="#1F2328">1 raised</text>
  <text x="84" y="270" font-size="10.5" text-anchor="middle" fill="#1F2328">Shelf bracket</text>
  <text x="84" y="285" font-size="10" text-anchor="middle" fill="#57606A">OpenSCAD</text>
  <!-- column 2: bracket, CadQuery  cx=190  4 raised -->
  <rect x="173" y="226" width="22" height="22" rx="3" fill="#0072B2"/>
  <rect x="173" y="200" width="22" height="22" rx="3" fill="#0072B2"/>
  <rect x="173" y="174" width="22" height="22" rx="3" fill="#0072B2"/>
  <rect x="173" y="148" width="22" height="22" rx="3" fill="#0072B2"/>
  <text x="184" y="138" font-size="10.5" text-anchor="middle" fill="#1F2328">4 raised</text>
  <text x="184" y="270" font-size="10.5" text-anchor="middle" fill="#1F2328">Shelf bracket</text>
  <text x="184" y="285" font-size="10" text-anchor="middle" fill="#57606A">CadQuery</text>
  <!-- column 3: enclosure, OpenSCAD  cx=290  5 silent -->
  <rect x="273" y="226" width="22" height="22" rx="3" fill="#D55E00"/>
  <rect x="273" y="200" width="22" height="22" rx="3" fill="#D55E00"/>
  <rect x="273" y="174" width="22" height="22" rx="3" fill="#D55E00"/>
  <rect x="273" y="148" width="22" height="22" rx="3" fill="#D55E00"/>
  <rect x="273" y="122" width="22" height="22" rx="3" fill="#D55E00"/>
  <text x="284" y="112" font-size="10.5" text-anchor="middle" fill="#1F2328">5 silent</text>
  <text x="284" y="270" font-size="10.5" text-anchor="middle" fill="#1F2328">Snap-fit enclosure</text>
  <text x="284" y="285" font-size="10" text-anchor="middle" fill="#57606A">OpenSCAD</text>
  <!-- column 4: enclosure, CadQuery  cx=390  3 silent -->
  <rect x="373" y="226" width="22" height="22" rx="3" fill="#D55E00"/>
  <rect x="373" y="200" width="22" height="22" rx="3" fill="#D55E00"/>
  <rect x="373" y="174" width="22" height="22" rx="3" fill="#D55E00"/>
  <text x="384" y="164" font-size="10.5" text-anchor="middle" fill="#1F2328">3 silent</text>
  <text x="384" y="270" font-size="10.5" text-anchor="middle" fill="#1F2328">Snap-fit enclosure</text>
  <text x="384" y="285" font-size="10" text-anchor="middle" fill="#57606A">CadQuery</text>
  <!-- column 5: thread, OpenSCAD  cx=490  1 raised -->
  <rect x="473" y="226" width="22" height="22" rx="3" fill="#0072B2"/>
  <text x="484" y="216" font-size="10.5" text-anchor="middle" fill="#1F2328">1 raised</text>
  <text x="484" y="270" font-size="10.5" text-anchor="middle" fill="#1F2328">Threaded adapter</text>
  <text x="484" y="285" font-size="10" text-anchor="middle" fill="#57606A">OpenSCAD</text>
  <!-- column 6: thread, CadQuery  cx=590  1 raised + 1 silent -->
  <rect x="573" y="226" width="22" height="22" rx="3" fill="#0072B2"/>
  <rect x="573" y="200" width="22" height="22" rx="3" fill="#D55E00"/>
  <text x="584" y="190" font-size="10.5" text-anchor="middle" fill="#1F2328">1 raised, 1 silent</text>
  <text x="584" y="270" font-size="10.5" text-anchor="middle" fill="#1F2328">Threaded adapter</text>
  <text x="584" y="285" font-size="10" text-anchor="middle" fill="#57606A">CadQuery</text>
  <!-- callout on the silent thread failure -->
  <text x="32" y="314" font-size="10.5" fill="#57606A">The silent square on the right is the adapter whose core a union dropped: the kernel reported valid=True;</text>
  <text x="32" y="329" font-size="10.5" fill="#57606A">a volume of 7,065 mm³ against the 10,323 expected caught it.</text>
  <!-- footnotes -->
  <text x="32" y="356" font-size="9.5" fill="#8B949E">Data: ModelRift, CadQuery vs OpenSCAD for AI-generated functional parts, 12 Sept 2026.</text>
  <text x="32" y="370" font-size="9.5" fill="#8B949E">One agent per cell (Claude Opus 5 via Claude Code), capped at 12 versions. "Silent" is the authors' class:</text>
  <text x="32" y="384" font-size="9.5" fill="#8B949E">wrong geometry the tool did not report. All six parts shipped printable.</text>
  <text x="32" y="398" font-size="9.5" fill="#8B949E">Not our measurement. Layout ours.</text>
</svg>
