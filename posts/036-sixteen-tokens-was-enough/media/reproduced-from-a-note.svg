<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="Arial, Helvetica, sans-serif">
  <title>Checkpoints a fresh agent reproduced from a 32-token note, by task</title>
  <rect width="660" height="400" fill="#08090A"/>
  <text x="24" y="34" fill="#E4E5E9" font-size="16" font-weight="700">Checkpoints a fresh agent reproduced from a 32-token note</text>
  <text x="24" y="54" fill="#B9BEC6" font-size="11">Reproducer within 5% relative of the explorer's validation score · 41 improvement checkpoints · 8 tasks</text>
  <!-- legend -->
  <rect x="24" y="70" width="10" height="10" fill="#45A87D"/>
  <text x="39" y="79" fill="#B9BEC6" font-size="10.5">reproduced</text>
  <rect x="112" y="70" width="10" height="10" fill="#B5822A"/>
  <text x="127" y="79" fill="#B9BEC6" font-size="10.5">missed: the note left out too much detail</text>
  <!-- rows: x0 = 214, 42 px per checkpoint, bar height 16, pitch 32 -->
  <text x="24" y="112" fill="#E4E5E9" font-size="11">Gene-Expr (tabular)</text>
  <rect x="214" y="100" width="167" height="16" fill="#45A87D"/>
  <text x="390" y="112" fill="#E4E5E9" font-size="11">4/4</text>

  <text x="24" y="144" fill="#E4E5E9" font-size="11">Folktables (tabular)</text>
  <rect x="214" y="132" width="167" height="16" fill="#45A87D"/>
  <text x="390" y="144" fill="#E4E5E9" font-size="11">4/4</text>

  <text x="24" y="176" fill="#E4E5E9" font-size="11">SST-2 (sentiment)</text>
  <rect x="214" y="164" width="167" height="16" fill="#45A87D"/>
  <text x="390" y="176" fill="#E4E5E9" font-size="11">4/4</text>

  <text x="24" y="208" fill="#E4E5E9" font-size="11">Reward model (HH-RLHF)</text>
  <rect x="214" y="196" width="167" height="16" fill="#45A87D"/>
  <text x="390" y="208" fill="#E4E5E9" font-size="11">4/4</text>

  <text x="24" y="240" fill="#E4E5E9" font-size="11">WikiText-103 (language modeling)</text>
  <rect x="214" y="228" width="209" height="16" fill="#45A87D"/>
  <text x="432" y="240" fill="#E4E5E9" font-size="11">5/5</text>

  <text x="24" y="272" fill="#E4E5E9" font-size="11">CIFAR-100 diffusion</text>
  <rect x="214" y="260" width="209" height="16" fill="#45A87D"/>
  <text x="432" y="272" fill="#E4E5E9" font-size="11">5/5</text>

  <text x="24" y="304" fill="#E4E5E9" font-size="11">ImageNet-1K (no pretraining)</text>
  <rect x="214" y="292" width="209" height="16" fill="#45A87D"/>
  <rect x="425" y="292" width="83" height="16" fill="#B5822A"/>
  <text x="516" y="304" fill="#E4E5E9" font-size="11">5/7</text>

  <text x="24" y="336" fill="#E4E5E9" font-size="11">CIFAR-10</text>
  <rect x="214" y="324" width="293" height="16" fill="#45A87D"/>
  <rect x="509" y="324" width="41" height="16" fill="#B5822A"/>
  <text x="558" y="336" fill="#E4E5E9" font-size="11">7/8</text>

  <!-- total -->
  <text x="24" y="362" fill="#B9BEC6" font-size="11" font-weight="700">Total: 38 of 41 checkpoints reproduced; the 64-token budget also passes 38 of 41</text>
  <!-- footnote -->
  <text x="24" y="382" fill="#5A6069" font-size="9.5">Data: Bertran, Roth &amp; Wu, arXiv 2606.11045 (June 2026), Table 3, 32-token prompt budget; all roles are Claude Opus agents in Claude Code.</text>
  <text x="24" y="394" fill="#5A6069" font-size="9.5">Not our measurement. Layout ours.</text>
</svg>
