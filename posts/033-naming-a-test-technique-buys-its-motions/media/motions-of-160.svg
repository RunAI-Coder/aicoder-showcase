<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="660" height="470" fill="#FBFBF8"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1F2328">Named the technique, got the motions</text>
  <text x="20" y="46" font-size="9.5" fill="#57606A">Out of 160 runs per condition (codex, GPT-5.6 Sol, 80 runs at each of two effort levels), what the author counted.</text>
  <circle cx="26" cy="63" r="5" fill="#0072B2"/><text x="36" y="67" font-size="9.5" fill="#57606A">a count the author reports</text>
  <circle cx="262" cy="63" r="5" fill="none" stroke="#D55E00" stroke-width="2"/><text x="272" y="67" font-size="9.5" fill="#57606A">the narrower count he treats as the technique working</text>

  <!-- x axis: x(v) = 270 + v*2.25 ; 0 -> 270, 160 -> 630 -->
  <line x1="270" y1="86" x2="270" y2="392" stroke="#E6E8EB"/>
  <line x1="360" y1="86" x2="360" y2="392" stroke="#E6E8EB"/>
  <line x1="450" y1="86" x2="450" y2="392" stroke="#E6E8EB"/>
  <line x1="540" y1="86" x2="540" y2="392" stroke="#E6E8EB"/>
  <line x1="630" y1="86" x2="630" y2="392" stroke="#E6E8EB"/>
  <line x1="270" y1="392" x2="630" y2="392" stroke="#C9CDD2"/>
  <text x="270" y="406" font-size="9" fill="#8A8F98" text-anchor="middle">0</text>
  <text x="360" y="406" font-size="9" fill="#8A8F98" text-anchor="middle">40</text>
  <text x="450" y="406" font-size="9" fill="#8A8F98" text-anchor="middle">80</text>
  <text x="540" y="406" font-size="9" fill="#8A8F98" text-anchor="middle">120</text>
  <text x="630" y="406" font-size="9" fill="#8A8F98" text-anchor="middle">160 runs</text>

  <!-- TLA+ : 159 model written / 0 model changed the code -->
  <text x="20" y="103" font-size="10" fill="#1F2328">TLA+</text>
  <line x1="270" y1="100" x2="627.75" y2="100" stroke="#E6E8EB"/>
  <circle cx="627.75" cy="100" r="5" fill="#0072B2"/>
  <text x="618" y="91" font-size="9" fill="#1F2328" text-anchor="end">159 wrote a model</text>
  <circle cx="270" cy="100" r="5" fill="none" stroke="#D55E00" stroke-width="2"/>
  <text x="279" y="103" font-size="9" fill="#D55E00">none found where the model changed the Rust code</text>

  <!-- Audit : 152 audited / 42 handed to an independent agent -->
  <text x="20" y="133" font-size="10" fill="#1F2328">Audit after implementing</text>
  <line x1="364.5" y1="130" x2="612" y2="130" stroke="#E6E8EB"/>
  <circle cx="612" cy="130" r="5" fill="#0072B2"/>
  <text x="602" y="122" font-size="9" fill="#1F2328" text-anchor="end">152 audited (151 changed code)</text>
  <circle cx="364.5" cy="130" r="5" fill="#0072B2"/>
  <text x="373" y="133" font-size="9" fill="#1F2328">42 used an independent agent (scored worse)</text>

  <!-- Differential testing : 135 something like it / 0 two implementations -->
  <text x="20" y="163" font-size="10" fill="#1F2328">Differential testing</text>
  <line x1="270" y1="160" x2="573.75" y2="160" stroke="#E6E8EB"/>
  <circle cx="573.75" cy="160" r="5" fill="#0072B2"/>
  <text x="564" y="151" font-size="9" fill="#1F2328" text-anchor="end">135 did "something you might call" it</text>
  <circle cx="270" cy="160" r="5" fill="none" stroke="#D55E00" stroke-width="2"/>
  <text x="279" y="163" font-size="9" fill="#D55E00">0 built two full implementations</text>

  <!-- QuickCheck : 160 used it / 97 checked more than one property -->
  <text x="20" y="193" font-size="10" fill="#1F2328">QuickCheck</text>
  <circle cx="630" cy="190" r="5" fill="#0072B2"/>
  <text x="620" y="193" font-size="9" fill="#1F2328" text-anchor="end">all used the library; 63 checked only a single property</text>

  <!-- TDD : 67 failing test first (Default 0) -->
  <text x="20" y="223" font-size="10" fill="#1F2328">TDD</text>
  <line x1="270" y1="220" x2="420.75" y2="220" stroke="#E6E8EB"/>
  <circle cx="420.75" cy="220" r="5" fill="#0072B2"/>
  <text x="430" y="223" font-size="9" fill="#1F2328">67 wrote a failing test first (Default: 0)</text>

  <!-- Fuzzing : 10 structured inputs / 5 effective -->
  <text x="20" y="253" font-size="10" fill="#1F2328">Fuzzing</text>
  <circle cx="292.5" cy="250" r="5" fill="#0072B2"/>
  <text x="302" y="245" font-size="9" fill="#1F2328">10 built structured random inputs (half found a real bug)</text>
  <circle cx="281.25" cy="250" r="5" fill="none" stroke="#D55E00" stroke-width="2"/>
  <text x="302" y="262" font-size="9" fill="#D55E00">5 used fuzzing "a bit effectively"</text>

  <!-- Kani : 1 real use changed code -->
  <text x="20" y="283" font-size="10" fill="#1F2328">Kani</text>
  <circle cx="272.25" cy="280" r="5" fill="none" stroke="#D55E00" stroke-width="2"/>
  <text x="282" y="283" font-size="9" fill="#D55E00">1 real use on the code that caught a bug and changed the implementation</text>

  <!-- Hegel skill : 157 used -->
  <text x="20" y="313" font-size="10" fill="#1F2328">Hegel skill</text>
  <circle cx="623.25" cy="310" r="5" fill="#0072B2"/>
  <text x="613" y="313" font-size="9" fill="#1F2328" text-anchor="end">157 used it; cost +26% / +41%; correctness slightly down (within noise)</text>

  <!-- ECC skill : 153 read -->
  <text x="20" y="343" font-size="10" fill="#1F2328">ECC test skill</text>
  <circle cx="614.25" cy="340" r="5" fill="#0072B2"/>
  <text x="604" y="343" font-size="9" fill="#1F2328" text-anchor="end">153 read it; the earlier they read it, the worse they scored</text>

  <!-- ToB skill : 108 opened -->
  <text x="20" y="373" font-size="10" fill="#1F2328">Trail of Bits skill</text>
  <circle cx="513" cy="370" r="5" fill="#0072B2"/>
  <text x="522" y="373" font-size="9" fill="#1F2328">108 opened it</text>

  <text x="20" y="428" font-size="8.5" fill="#8A8F98">Data: Dan Luu, "How well do agents use test/verification techniques?" (Sept 2026). Zstd implementation in Rust; counts as stated in the post.</text>
  <text x="20" y="442" font-size="8.5" fill="#8A8F98">Each row counts something different, named on the row. Not our measurement. Layout ours.</text>
</svg>
