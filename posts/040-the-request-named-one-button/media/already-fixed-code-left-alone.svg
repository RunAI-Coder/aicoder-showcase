<svg xmlns='http://www.w3.org/2000/svg' width='660' height='440' viewBox='0 0 660 440' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'>
<title>How often already-fixed code was left alone, by prompt wording</title>
